<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Studio v31</title></head>
<body style="padding:1rem;font-family:sans-serif;max-width:520px;margin:0 auto;padding-bottom:4rem">

<h1>Style Studio v31</h1>

<p>Cle API Agnes :</p>
<textarea id="k" style="width:100%;min-height:60px;padding:.5rem;font-family:monospace;font-size:13px" placeholder="Colle ta cle M"></textarea>
<button onclick="sauver()" style="padding:.8rem;width:100%;font-size:.9rem;background:#111;color:#fff;border:none;border-radius:8px;margin-top:.5rem">ENREGISTRER</button>
<div id="out" style="margin-top:.8rem;padding:.8rem;background:#f0f0f0;border:2px solid #333;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px">Etat : aucune cle</div>

<hr style="margin:1.2rem 0">

<p><b>1. Photo de reference :</b></p>
<input type="file" accept="image/*" id="imgIn" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:8px">
<button onclick="chargerImage()" style="padding:.8rem;width:100%;font-size:.9rem;background:#111;color:#fff;border:none;border-radius:8px;margin-top:.3rem">CHARGER L IMAGE</button>
<div id="imgOut" style="margin-top:.8rem;padding:.8rem;background:#f0f0f0;border:2px solid #333;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px">Pas encore</div>
<div id="imgWrap" style="margin-top:.5rem"></div>

<hr style="margin:1.2rem 0">

<p><b>2. TON PROMPT PERSONNALISE :</b></p>
<textarea id="monPrompt" style="width:100%;min-height:80px;padding:.6rem;border:1px solid #ccc;border-radius:8px;font-family:inherit;font-size:.82rem;box-sizing:border-box" placeholder="Ex: Transforme cette photo en film Netflix dramatique, une espionne prepare sa mission finale."></textarea>

<p style="font-size:.75rem;color:#666;margin:.5rem 0 .2rem">Chemise :</p>
<select id="etatChemise" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:8px;font-size:.85rem;background:#fff">
  <option value="">(garder tel quel)</option>
  <option value="fermee entierement boutonnee jusqu au col">Fermee jusqu au col</option>
  <option value="un seul bouton ouvert en haut">1 bouton ouvert</option>
  <option value="deux boutons ouverts, petit decollete">2 boutons ouverts</option>
  <option value="trois boutons ouverts, semi-ouverte">3 boutons ouverts</option>
  <option value="largement ouverte">Grande ouverte</option>
</select>

<p style="font-size:.75rem;color:#666;margin:.5rem 0 .2rem">Style vestimentaire :</p>
<select id="styleVetement" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:8px;font-size:.85rem;background:#fff">
  <option value="">(garder tel quel)</option>
  <option value="bureau elegant, chemise et blazer">Bureau elegant</option>
  <option value="decontracte chic">Decontracte chic</option>
  <option value="robe de soiree elegante">Robe de soiree</option>
  <option value="cocktail chic">Cocktail</option>
  <option value="streetwear urbain">Streetwear</option>
  <option value="vintage annees 60">Vintage 60s</option>
  <option value="cyberpunk, cuir et neons">Cyberpunk</option>
  <option value="detective noir, impermeable et chapeau">Detective noir</option>
  <option value="reine medievale, robe longue">Reine medievale</option>
  <option value="futuriste brillant, combinaison">Futuriste</option>
</select>

<p style="font-size:.75rem;color:#666;margin:.5rem 0 .2rem">Accessoires (1 par ligne) :</p>
<textarea id="accessoires" style="width:100%;min-height:60px;padding:.5rem;border:1px solid #ccc;border-radius:8px;font-family:inherit;font-size:.82rem;box-sizing:border-box" placeholder="- Lunettes aviateur&#10;- Collier dore&#10;- Sac noir"></textarea>

<p style="font-size:.75rem;color:#666;margin:.5rem 0 .2rem">Duree video :</p>
<select id="dureeVideo" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:8px;font-size:.85rem;background:#fff">
  <option value="6">6 secondes</option>
  <option value="8">8 secondes</option>
  <option value="10" selected>10 secondes</option>
  <option value="15">15 secondes</option>
  <option value="20">20 secondes</option>
</select>

<p style="font-size:.75rem;color:#666;margin:.5rem 0 .2rem">Nombre de scenes :</p>
<select id="nbScenes" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:8px;font-size:.85rem;background:#fff">
  <option value="3">3 scenes</option>
  <option value="5" selected>5 scenes</option>
  <option value="8">8 scenes</option>
</select>

<button onclick="lancerIA()" style="padding:1rem;width:100%;font-size:1rem;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:.8rem">LANCER L IA</button>
<div id="iaOut" style="margin-top:.8rem;padding:.8rem;background:#f0f0f0;border:2px solid #333;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px">Pas encore lance</div>

<div id="scenarioBlock" style="display:none;margin-top:1rem">
  <p><b>3. Scenario :</b></p>
  <div id="scenarioDisplay" style="padding:.8rem;background:#f5f0ff;border:2px solid #7c3aed;border-radius:8px;font-family:monospace;font-size:11px;white-space:pre-wrap;line-height:1.5;max-height:350px;overflow-y:auto"></div>
</div>

<div id="stylesBlock" style="display:none;margin-top:1rem">
  <p><b>4. Styles proposes :</b></p>
  <div id="stylesSuggestions"></div>
  <button onclick="genererTout()" style="padding:1rem;width:100%;font-size:1rem;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:.8rem">GENERER LES IMAGES</button>
  <div id="genOut" style="margin-top:.8rem;padding:.8rem;background:#f0f0f0;border:2px solid #333;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px">Pas encore lance</div>
</div>

<div id="scenesGrid" style="margin-top:1rem"></div>

<script>
var API_KEY = '';
var IMAGE_DATA = '';
var SCENARIO = null;
var STYLES_IA = [];
var STYLES_CHOISIS = [];
var SCENES = [];

function setOut(id, txt, color) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = txt;
  if (color) el.style.background = color;
}

function sauver() {
  var t = document.getElementById('k').value;
  var cleaned = '';
  for (var i = 0; i < t.length; i++) {
    var c = t.charAt(i);
    if (c !== ' ' && c !== '\n' && c !== '\r' && c !== '\t') cleaned += c;
  }
  var idx = cleaned.indexOf('sk-');
  if (idx < 0) { setOut('out', 'Erreur : doit contenir sk-', '#ffebee'); return; }
  var rest = cleaned.substring(idx);
  var finalKey = 'sk-';
  for (var j = 3; j < rest.length; j++) {
    var ch = rest.charAt(j);
    if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z') || (ch >= '0' && ch <= '9') || ch === '_' || ch === '-') finalKey += ch;
  }
  if (finalKey.length < 20) { setOut('out', 'Cle trop courte', '#ffebee'); return; }
  API_KEY = finalKey;
  document.getElementById('k').value = finalKey;
  setOut('out', 'CLE ENREGISTREE\n' + finalKey + '\n(' + finalKey.length + ' chars)', '#e8f5e9');
}

function chargerImage() {
  var f = document.getElementById('imgIn').files[0];
  if (!f) { setOut('imgOut', 'Choisis une image', '#ffebee'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      var sc = Math.min(1, 1024 / Math.max(w, h));
      var nw = Math.round(w * sc), nh = Math.round(h * sc);
      var canvas = document.createElement('canvas');
      canvas.width = nw; canvas.height = nh;
      canvas.getContext('2d').drawImage(img, 0, 0, nw, nh);
      var compressed = canvas.toDataURL('image/jpeg', 0.85);
      IMAGE_DATA = compressed;
      setOut('imgOut', 'IMAGE CHARGEE\n' + nw + 'x' + nh + ' px - ' + Math.round(compressed.length/1024) + ' Ko', '#e8f5e9');
      document.getElementById('imgWrap').innerHTML = '<img src="' + compressed + '" style="max-width:100%;border-radius:8px;margin-top:.5rem">';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function extraireJSON(t) {
  var d = t.indexOf('{');
  var f = t.lastIndexOf('}');
  if (d < 0 || f < 0) return null;
  try { return JSON.parse(t.substring(d, f + 1)); } catch (e) { return null; }
}

function lancerIA() {
  if (!API_KEY) { setOut('iaOut', 'Enregistre la cle Agnes', '#ffebee'); return; }
  if (!IMAGE_DATA) { setOut('iaOut', 'Charge une image d abord', '#ffebee'); return; }

  var monPrompt = document.getElementById('monPrompt').value.trim();
  if (!monPrompt) { setOut('iaOut', 'Ecris ton prompt d abord', '#ffebee'); return; }

  var etatChemise = document.getElementById('etatChemise').value;
  var styleVetement = document.getElementById('styleVetement').value;
  var accessoires = document.getElementById('accessoires').value.trim();
  var nbScenes = parseInt(document.getElementById('nbScenes').value, 10);

  setOut('iaOut', 'L IA analyse et ecrit ' + nbScenes + ' scenes...', '#fff8e1');

  var sys = 'Tu es un scenariste. Tu ecris un scenario avec des scenes. Reponds UNIQUEMENT en JSON valide.';

  var userInput = 'DEMANDE : ' + monPrompt;
  if (etatChemise) userInput += ' VETEMENT-chemise : ' + etatChemise;
  if (styleVetement) userInput += ' STYLE-VETEMENT : ' + styleVetement;
  if (accessoires) userInput += ' ACCESSOIRES : ' + accessoires;

  var usr = userInput + ' Analyse la photo et ecris un scenario de ' + nbScenes + ' scenes. Retourne UNIQUEMENT ce JSON :' +
    '{"style_description":"francais 40 mots","character_description":"francais 60 mots avec vetements et accessoires","style_base_prompt":"english 80 words","mood":"mot","medium":"francais","scenario":{"title":"titre","logline":"resume","genre":"cinema|anime|cartoon|netflix","synopsis":"francais 80 mots","scenes":[{"scene_number":1,"description":"francais description","image_prompt":"english 50 words","action_video":"english 30 words motion"}],"final_image_prompt":"english 50 words"},"styles_suggeres":[{"title":"Wes Anderson","sub":"sous-titre","prompt":"english 30 words"},{"title":"Studio Ghibli","sub":"sous-titre","prompt":"english 30 words"},{"title":"Netflix Drama","sub":"sous-titre","prompt":"english 30 words"},{"title":"Pixar 3D","sub":"sous-titre","prompt":"english 30 words"},{"title":"Cartoon","sub":"sous-titre","prompt":"english 30 words"},{"title":"Cyberpunk","sub":"sous-titre","prompt":"english 30 words"},{"title":"Film Noir","sub":"sous-titre","prompt":"english 30 words"},{"title":"Anime Shonen","sub":"sous-titre","prompt":"english 30 words"}]}';

  fetch('https://apihub.agnes-ai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'agnes-2.5-flash',
      messages: [
        { role: 'system', content: sys },
        { role: 'user', content: [
          { type: 'text', text: usr },
          { type: 'image_url', image_url: { url: IMAGE_DATA } }
        ]}
      ],
      temperature: 0.6,
      max_tokens: 4000
    })
  })
  .then(function(r) { return r.text(); })
  .then(function(txt) {
    var data = JSON.parse(txt);
    var msg = data.choices && data.choices[0] && data.choices[0].message;
    var contenu = msg && (msg.content || msg.reasoning_content);
    var parsed = extraireJSON(contenu);
    if (!parsed) {
      setOut('iaOut', 'JSON mal forme', '#fff8e1');
      return;
    }
    SCENARIO = parsed;
    STYLES_IA = (parsed.styles_suggeres || []).map(function(s, idx) {
      return { id: 'ia_' + idx, title: s.title, sub: s.sub, prompt: s.prompt, selected: true };
    });
    setOut('iaOut', 'IA OK : ' + (parsed.scenario ? parsed.scenario.title : '-'), '#e8f5e9');
    afficherScenario(parsed);
    afficherStylesIA();
  })
  .catch(function(e) { setOut('iaOut', 'Erreur : ' + e.message, '#ffebee'); });
}

function afficherScenario(parsed) {
  var bloc = document.getElementById('scenarioBlock');
  var disp = document.getElementById('scenarioDisplay');
  if (!parsed.scenario) { bloc.style.display = 'none'; return; }
  var sc = parsed.scenario;
  var txt = 'TITRE : ' + (sc.title || '-') + '\nGENRE : ' + (sc.genre || '-') + '\n\nSYNOPSIS :\n' + (sc.synopsis || '-') + '\n\nSCENES :\n';
  var scenes = sc.scenes || [];
  for (var i = 0; i < scenes.length; i++) {
    txt += '\nScene ' + (scenes[i].scene_number || (i+1)) + ' : ' + (scenes[i].description || '-') + '\n';
  }
  disp.textContent = txt;
  bloc.style.display = 'block';
}

function afficherStylesIA() {
  var bloc = document.getElementById('stylesBlock');
  var cont = document.getElementById('stylesSuggestions');
  var html = '';
  for (var i = 0; i < STYLES_IA.length; i++) {
    var s = STYLES_IA[i];
    html += '<label style="display:flex;align-items:center;gap:.5rem;padding:.5rem;background:#fff;border:2px solid #e5e5e5;border-radius:8px;margin-bottom:.35rem">';
    html += '<input type="checkbox" ' + (s.selected ? 'checked' : '') + ' onchange="toggleStyle(' + i + ', this.checked)" style="width:18px;height:18px">';
    html += '<div><div style="font-weight:bold;font-size:.85rem">' + (s.title || '') + '</div><div style="font-size:.7rem;color:#666">' + (s.sub || '') + '</div></div>';
    html += '</label>';
  }
  cont.innerHTML = html;
  bloc.style.display = 'block';
}

function toggleStyle(index, checked) {
  if (STYLES_IA[index]) STYLES_IA[index].selected = checked;
}

function genererTout() {
  if (!SCENARIO) { setOut('genOut', 'Lance l IA d abord', '#ffebee'); return; }
  STYLES_CHOISIS = STYLES_IA.filter(function(s) { return s.selected; });
  if (!STYLES_CHOISIS.length) { setOut('genOut', 'Coche au moins un style', '#ffebee'); return; }

  var scenesData = SCENARIO.scenario ? (SCENARIO.scenario.scenes || []) : [];
  SCENES = [];
  for (var i = 0; i < scenesData.length; i++) {
    SCENES.push({
      index: i,
      scene: scenesData[i],
      imagePrompt: scenesData[i].image_prompt || scenesData[i].description || '',
      imageUrl: null
    });
  }

  setOut('genOut', 'Generation ' + STYLES_CHOISIS.length + ' style(s) x ' + SCENES.length + ' scenes...', '#fff8e1');
  document.getElementById('scenesGrid').innerHTML = '';
  renderScenesGrid();
  genererImagesSequentielles(0, 0);
}

function renderScenesGrid() {
  var html = '';
  for (var s = 0; s < STYLES_CHOISIS.length; s++) {
    var st = STYLES_CHOISIS[s];
    html += '<div style="margin-bottom:1.5rem;padding:.6rem;background:#f9f9fb;border-radius:10px;border:1px solid #e5e5e5">';
    html += '<div style="font-weight:bold;font-size:.9rem;margin-bottom:.5rem;color:#7c3aed">STYLE : ' + (st.title || '') + '</div>';
    for (var i = 0; i < SCENES.length; i++) {
      var key = 'scene_' + s + '_' + i;
      html += '<div id="card-' + key + '" style="background:#fff;border:2px solid #e5e5e5;border-radius:10px;padding:.5rem;margin-bottom:.5rem">';
      html += '<img id="img-' + key + '" style="width:100%;border-radius:6px;background:#f0f0f0;aspect-ratio:16/9;object-fit:cover" src="">';
      html += '<div style="font-size:.78rem;font-weight:bold;margin-top:.3rem">Scene ' + (i+1) + '</div>';
      html += '<div style="font-size:.68rem;color:#666">' + ((SCENES[i].scene.description || '').substring(0, 100)) + '</div>';
      html += '<div id="st-' + key + '" style="font-size:.7rem;margin-top:.2rem;color:#666">En attente</div>';
      html += '<div id="animer-' + key + '" style="display:none;margin-top:.4rem">';
      html += '<button onclick="lancerVideo(' + s + ',' + i + ')" id="btnvideo-' + key + '" style="padding:.6rem;width:100%;font-size:.78rem;background:#ff5a1f;color:#fff;border:none;border-radius:6px;font-weight:bold">GENERER LA VIDEO</button>';
      html += '<div id="vstat-' + key + '" style="font-size:.66rem;color:#666;margin-top:.3rem;font-family:monospace;text-align:center;white-space:pre-wrap"></div>';
      html += '<div id="vwrap-' + key + '"></div>';
      html += '</div></div>';
    }
    html += '</div>';
  }
  document.getElementById('scenesGrid').innerHTML = html;
}

function genererImagesSequentielles(styleIdx, sceneIdx) {
  if (styleIdx >= STYLES_CHOISIS.length) {
    setOut('genOut', 'TOUTES LES IMAGES GENEREES !', '#e8f5e9');
    return;
  }
  if (sceneIdx >= SCENES.length) {
    genererImagesSequentielles(styleIdx + 1, 0);
    return;
  }

  var style = STYLES_CHOISIS[styleIdx];
  var scene = SCENES[sceneIdx];
  var key = 'scene_' + styleIdx + '_' + sceneIdx;
  var st = document.getElementById('st-' + key);
  if (st) st.textContent = 'Generation...';

  var personnage = SCENARIO.character_description || '';
  var base = SCENARIO.style_base_prompt || '';
  var userPrompt = document.getElementById('monPrompt').value.trim();

  var fullPrompt = 'Cinematic keyframe. Character (identical across scenes): ' + personnage + '. Style base: ' + base + '. Apply style: ' + (style.prompt || '') + '. Scene ' + (sceneIdx + 1) + ': ' + scene.imagePrompt + '. User context: ' + userPrompt + '. Cinematic quality, 16:9.';

  fetch('https://apihub.agnes-ai.com/v1/images/generations', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'agnes-image-2.1-flash', prompt: fullPrompt, n: 1, size: '1K', ratio: '16:9' })
  })
  .then(function(r) { return r.text(); })
  .then(function(txt) {
    var data = JSON.parse(txt);
    var item = data.data && data.data[0];
    var imgUrl = item && (item.url || (item.b64_json ? 'data:image/png;base64,' + item.b64_json : null));
    if (!imgUrl) {
      if (st) { st.textContent = 'Erreur image'; st.style.color = '#c00'; }
      setTimeout(function() { genererImagesSequentielles(styleIdx, sceneIdx + 1); }, 1500);
      return;
    }
    scene.imageUrl = imgUrl;
    var imgEl = document.getElementById('img-' + key);
    if (imgEl) imgEl.src = imgUrl;
    if (st) { st.innerHTML = '<span style="color:#16a34a">Image OK</span>'; }
    var animerEl = document.getElementById('animer-' + key);
    if (animerEl) animerEl.style.display = 'block';
    setTimeout(function() { genererImagesSequentielles(styleIdx, sceneIdx + 1); }, 2000);
  })
  .catch(function(e) {
    if (st) { st.textContent = 'Erreur'; st.style.color = '#c00'; }
    setTimeout(function() { genererImagesSequentielles(styleIdx, sceneIdx + 1); }, 1500);
  });
}

function lancerVideo(styleIdx, sceneIdx) {
  var style = STYLES_CHOISIS[styleIdx];
  var scene = SCENES[sceneIdx];
  if (!scene || !scene.imageUrl) return;

  var key = 'scene_' + styleIdx + '_' + sceneIdx;
  var st = document.getElementById('vstat-' + key);
  var btn = document.getElementById('btnvideo-' + key);
  btn.disabled = true;
  btn.textContent = 'Creation...';

  var dureeSec = parseInt(document.getElementById('dureeVideo').value, 10);
  var numFrames = dureeSec * 24 + 1;
  var personnage = SCENARIO.character_description || '';
  var actionVideo = scene.scene.action_video || 'subtle natural movement';

  var prompt = 'Animate this image. Character identical. Action: ' + actionVideo + '. Style: ' + (style.prompt || '') + '. Character: ' + personnage + '. Cinematic.';

  var body = {
    model: 'agnes-video-v2.0',
    prompt: prompt,
    image: scene.imageUrl,
    num_frames: numFrames,
    frame_rate: 24
  };

  st.textContent = 'Envoi a Agnes (' + dureeSec + 's)...';
  envoyerVideoAvecRetry(body, key, 0);
}

function envoyerVideoAvecRetry(body, key, attempt) {
  var st = document.getElementById('vstat-' + key);
  var btn = document.getElementById('btnvideo-' + key);
  var delais = [0, 15, 30, 45, 60, 90, 120, 180, 240, 300];

  if (attempt >= delais.length) {
    st.textContent = 'Agnes sature. Reessaie plus tard.';
    btn.disabled = false;
    btn.textContent = 'REESSAYER';
    return;
  }

  var delai = delais[attempt];
  if (delai > 0) {
    st.textContent = 'Retry dans ' + delai + 's... (' + (attempt + 1) + '/' + delais.length + ')';
    setTimeout(function() { envoyerVideoAvecRetry(body, key, attempt + 1); }, delai * 1000);
