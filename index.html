<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style v27</title></head>
<body style="padding:1rem;font-family:sans-serif;max-width:520px;margin:0 auto">

<h1>Style Studio v27</h1>

<p>Cle API Agnes :</p>
<textarea id="k" style="width:100%;min-height:50px;padding:.5rem;font-family:monospace;font-size:13px" placeholder="Colle ta cle M"></textarea>
<button onclick="sauver()" style="padding:.8rem;width:100%;font-size:.9rem;background:#111;color:#fff;border:none;border-radius:8px;margin-top:.5rem">ENREGISTRER</button>
<div id="out" style="margin-top:.8rem;padding:.8rem;background:#f0f0f0;border:2px solid #333;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px">Etat : aucune cle</div>

<hr style="margin:1.2rem 0">

<p><b>1. Photo a transformer :</b></p>
<input type="file" accept="image/*" id="imgIn" style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:8px">
<button onclick="chargerImage()" style="padding:.8rem;width:100%;font-size:.9rem;background:#111;color:#fff;border:none;border-radius:8px;margin-top:.3rem">CHARGER L IMAGE</button>
<div id="imgOut" style="margin-top:.8rem;padding:.8rem;background:#f0f0f0;border:2px solid #333;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px">Pas encore</div>
<div id="imgWrap" style="margin-top:.5rem"></div>

<hr style="margin:1.2rem 0">

<p><b>2. Decris ta photo :</b></p>

<p style="font-size:.85rem;color:#666;margin-top:.5rem">Description du personnage :</p>
<textarea id="personnage" style="width:100%;min-height:70px;padding:.5rem;border:1px solid #ccc;border-radius:8px;font-family:inherit;font-size:.85rem;box-sizing:border-box" placeholder="Ex: Femme blonde aux cheveux longs ondules, chapeau cowboy noir decoré, chemise bleue, veste noire, assise, regard vers le cote"></textarea>

<p style="font-size:.85rem;color:#666;margin-top:.8rem">Description de l histoire et du style souhaite :</p>
<textarea id="histoire" style="width:100%;min-height:70px;padding:.5rem;border:1px solid #ccc;border-radius:8px;font-family:inherit;font-size:.85rem;box-sizing:border-box" placeholder="Ex: Portrait editorial minimaliste, lumiere naturelle douce, ambiance intimiste, couleurs desaturees, style magazine moderne"></textarea>

<hr style="margin:1.2rem 0">

<p><b>3. Combien de styles ?</b></p>
<select id="nbStyles" style="width:100%;padding:.7rem;border:1px solid #ccc;border-radius:8px;font-size:.9rem;background:#fff">
  <option value="1" selected>1 style (test video)</option>
  <option value="3">3 styles</option>
  <option value="5">5 styles</option>
  <option value="10">10 styles</option>
</select>
<button onclick="genererStyles()" style="padding:.8rem;width:100%;font-size:.9rem;background:#16a34a;color:#fff;border:none;border-radius:8px;margin-top:.5rem">GENERER LES STYLES</button>
<div id="genOut" style="margin-top:.8rem;padding:.8rem;background:#f0f0f0;border:2px solid #333;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px">Pas encore lance</div>

<div id="stylesGrid" style="margin-top:1rem"></div>

<script>
var API_KEY = '';
var IMAGE_DATA = '';
var GENERATED_STYLES = [];

function setOut(id, txt, color) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = txt;
  if (color) el.style.background = color;
}

function sauver() {
  var t = document.getElementById('k').value;
  var cleaned = '';
  for (var i = 0; i < t.length; i++) {
    var c = t.charAt(i);
    if (c !== ' ' && c !== '\n' && c !== '\r' && c !== '\t') cleaned += c;
  }
  var idx = cleaned.indexOf('sk-');
  if (idx < 0) { setOut('out', 'Erreur : doit contenir sk-', '#ffebee'); return; }
  var rest = cleaned.substring(idx);
  var finalKey = 'sk-';
  for (var j = 3; j < rest.length; j++) {
    var ch = rest.charAt(j);
    if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z') || (ch >= '0' && ch <= '9') || ch === '_' || ch === '-') finalKey += ch;
  }
  if (finalKey.length < 20) { setOut('out', 'Cle trop courte', '#ffebee'); return; }
  API_KEY = finalKey;
  document.getElementById('k').value = finalKey;
  setOut('out', 'CLE ENREGISTREE\n' + finalKey + '\n(' + finalKey.length + ' chars)', '#e8f5e9');
}

function chargerImage() {
  var f = document.getElementById('imgIn').files[0];
  if (!f) { setOut('imgOut', 'Choisis une image', '#ffebee'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      var sc = Math.min(1, 1024 / Math.max(w, h));
      var nw = Math.round(w * sc), nh = Math.round(h * sc);
      var canvas = document.createElement('canvas');
      canvas.width = nw; canvas.height = nh;
      canvas.getContext('2d').drawImage(img, 0, 0, nw, nh);
      var compressed = canvas.toDataURL('image/jpeg', 0.85);
      IMAGE_DATA = compressed;
      setOut('imgOut', 'IMAGE CHARGEE\n' + nw + 'x' + nh + ' px - ' + Math.round(compressed.length/1024) + ' Ko', '#e8f5e9');
      document.getElementById('imgWrap').innerHTML = '<img src="' + compressed + '" style="max-width:100%;border-radius:8px;margin-top:.5rem">';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function extraireJSON(t) {
  var d = t.indexOf('{'), f = t.lastIndexOf('}');
  if (d < 0 || f < 0) return null;
  try { return JSON.parse(t.substring(d, f + 1)); } catch (e) { return null; }
}

function genererStyles() {
  var personnage = document.getElementById('personnage').value.trim();
  var histoire = document.getElementById('histoire').value.trim();

  if (!personnage) { setOut('genOut', 'Remplis la description du personnage', '#ffebee'); return; }
  if (!histoire) { setOut('genOut', 'Remplis la description de l histoire', '#ffebee'); return; }
  if (!API_KEY) { setOut('genOut', 'Enregistre la cle Agnes', '#ffebee'); return; }
  if (!IMAGE_DATA) { setOut('genOut', 'Charge une image d abord', '#ffebee'); return; }

  var nb = parseInt(document.getElementById('nbStyles').value, 10);
  setOut('genOut', 'Demande de ' + nb + ' styles...', '#fff8e1');
  GENERATED_STYLES = [];
  document.getElementById('stylesGrid').innerHTML = '';

  var sys = 'Tu es un directeur artistique. Reponds UNIQUEMENT en JSON valide.';
  var usr = 'Voici la description d une photo a transformer en plusieurs styles :\n\n' +
            'PERSONNAGE : ' + personnage + '\n\n' +
            'HISTOIRE ET STYLE : ' + histoire + '\n\n' +
            'Donne exactement ' + nb + ' styles visuels varies pour transformer cette photo (Wes Anderson, Studio Ghibli, cyberpunk, aquarelle, cartoon Simpson, etc.).\n\n' +
            'Retourne ce JSON : {"styles":[{"title":"Nom court","sub":"sous-titre 5 mots","prompt":"english prompt 25-40 words to apply this style while preserving the character identity"}]}';

  fetch('https://apihub.agnes-ai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'agnes-2.5-flash',
      messages: [
        { role: 'system', content: sys },
        { role: 'user', content: usr }
      ],
      temperature: 0.85,
      max_tokens: 3000
    })
  })
  .then(function(r) { return r.text(); })
  .then(function(txt) {
    var data = JSON.parse(txt);
    var msg = data.choices && data.choices[0] && data.choices[0].message;
    var contenu = msg && (msg.content || msg.reasoning_content);
    var parsed = extraireJSON(contenu);
    if (!parsed) { setOut('genOut', 'JSON mal forme', '#fff8e1'); return; }
    GENERATED_STYLES = (parsed.styles || []).slice(0, nb);
    setOut('genOut', 'STYLES : ' + GENERATED_STYLES.length, '#e8f5e9');
    renderGrid();
    genererImages(0);
  })
  .catch(function(e) { setOut('genOut', 'Erreur : ' + e.message, '#ffebee'); });
}

function renderGrid() {
  var html = '';
  for (var i = 0; i < GENERATED_STYLES.length; i++) {
    var s = GENERATED_STYLES[i];
    html += '<div id="card-' + i + '" style="background:#fff;border:2px solid #e5e5e5;border-radius:12px;padding:.8rem;margin-bottom:1rem">';
    html += '<img id="img-' + i + '" style="width:100%;border-radius:8px;background:#f0f0f0;aspect-ratio:1/1;object-fit:cover" src="">';
    html += '<div style="font-size:.95rem;font-weight:bold;margin-top:.5rem">' + (s.title || 'Style ' + (i+1)) + '</div>';
    html += '<div style="font-size:.75rem;color:#666">' + (s.sub || '') + '</div>';
    html += '<div id="st-' + i + '" style="font-size:.75rem;margin-top:.3rem;color:#666">En attente</div>';
    html += '<div id="animer-' + i + '" style="display:none;margin-top:.6rem">';
    html += '<button onclick="lancerVideoAgnes(' + i + ')" id="btnvideo-' + i + '" style="padding:.8rem;width:100%;font-size:.9rem;background:#ff5a1f;color:#fff;border:none;border-radius:8px;font-weight:bold">GENERER LA VIDEO (6s)</button>';
    html += '<div id="vstat-' + i + '" style="font-size:.72rem;color:#666;margin-top:.4rem;font-family:monospace;text-align:center;white-space:pre-wrap"></div>';
    html += '<div id="vwrap-' + i + '"></div>';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('stylesGrid').innerHTML = html;
}

function genererImages(index) {
  if (index >= GENERATED_STYLES.length) {
    setOut('genOut', 'TERMINE ! ' + GENERATED_STYLES.length + ' images.', '#e8f5e9');
    return;
  }
  var s = GENERATED_STYLES[index];
  var st = document.getElementById('st-' + index);
  if (st) st.textContent = 'Generation...';

  var personnage = document.getElementById('personnage').value.trim();
  var histoire = document.getElementById('histoire').value.trim();

  var fullPrompt = 'Transform this exact image. ' +
    'Character to preserve (identity, face, pose, clothing must stay identical): ' + personnage + '. ' +
    'Setting and atmosphere: ' + histoire + '. ' +
    'Apply this additional art style: ' + (s.prompt || '') + '. ' +
    'Keep the original composition, framing, and subject exactly the same. ' +
    'High quality, detailed, cinematic rendering.';

  fetch('https://apihub.agnes-ai.com/v1/images/generations', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'agnes-image-2.1-flash', prompt: fullPrompt, n: 1, size: '1K', ratio: '1:1' })
  })
  .then(function(r) { return r.text(); })
  .then(function(txt) {
    var data = JSON.parse(txt);
    var item = data.data && data.data[0];
    var imgUrl = item && (item.url || (item.b64_json ? 'data:image/png;base64,' + item.b64_json : null));
    if (!imgUrl) {
      if (st) { st.textContent = 'Pas d URL'; st.style.color = '#c00'; }
      setTimeout(function() { genererImages(index + 1); }, 1500);
      return;
    }
    GENERATED_STYLES[index].imgUrl = imgUrl;
    var imgEl = document.getElementById('img-' + index);
    if (imgEl) imgEl.src = imgUrl;
    if (st) { st.innerHTML = '<span style="color:#16a34a">OK</span>'; }
    document.getElementById('animer-' + index).style.display = 'block';
    setTimeout(function() { genererImages(index + 1); }, 2000);
  })
  .catch(function(e) {
    if (st) { st.textContent = 'Erreur'; st.style.color = '#c00'; }
    setTimeout(function() { genererImages(index + 1); }, 1500);
  });
}

// VIDEO AGNES avec RETRY sur 503
function lancerVideoAgnes(index) {
  var s = GENERATED_STYLES[index];
  if (!s || !s.imgUrl) return;
  var st = document.getElementById('vstat-' + index);
  var btn = document.getElementById('btnvideo-' + index);
  btn.disabled = true;
  btn.textContent = 'Creation...';
  st.textContent = 'Envoi a Agnes...';

  var personnage = document.getElementById('personnage').value.trim();

  var body = {
    model: 'agnes-video-v2.0',
    prompt: 'Animate this image with subtle natural movement, breathing, gentle hair movement, warm cinematic light, no music. Character: ' + personnage,
    image: s.imgUrl,
    num_frames: 145,
    frame_rate: 24
  };

  envoyerVideoAvecRetry(body, index, 0);
}

function envoyerVideoAvecRetry(body, index, attempt) {
  var st = document.getElementById('vstat-' + index);
  var btn = document.getElementById('btnvideo-' + index);
  var delais = [0, 15, 30, 45, 60, 90, 120, 180, 240, 300];

  if (attempt >= delais.length) {
    st.textContent = 'Agnes sature apres ' + delais.length + ' tentatives.\nReessaie plus tard.';
    btn.disabled = false;
    btn.textContent = 'REESSAYER';
    return;
  }

  var delai = delais[attempt];
  if (delai > 0) {
    st.textContent = 'Agnes sature. Nouvelle tentative dans ' + delai + 's...\n(tentative ' + (attempt + 1) + '/' + delais.length + ')';
    setTimeout(function() { envoyerVideoAvecRetry(body, index, attempt + 1); }, delai * 1000);
    return;
  }

  st.textContent = 'Envoi a Agnes (tentative ' + (attempt + 1) + ')...';

  fetch('https://apihub.agnes-ai.com/v1/videos', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r) { return r.text().then(function(txt) { return { status: r.status, body: txt }; }); })
  .then(function(res) {
    if (res.status === 200) {
      try {
        var data = JSON.parse(res.body);
        var videoId = data.video_id || data.id || data.task_id;
        if (!videoId) {
          st.textContent = 'Reponse sans video_id';
          btn.disabled = false;
          btn.textContent = 'REESSAYER';
          return;
        }
        st.textContent = 'Tache creee ! Polling...';
        btn.textContent = 'EN COURS...';
        pollVideo(videoId, index, 0);
      } catch (e) {
        st.textContent = 'JSON invalide : ' + res.body.substring(0, 150);
        btn.disabled = false;
        btn.textContent = 'REESSAYER';
      }
      return;
    }
    if (res.status === 503) { envoyerVideoAvecRetry(body, index, attempt + 1); return; }
    if (res.status === 429) {
      st.textContent = 'Limite atteinte. Retry dans 30s...';
      setTimeout(function() { envoyerVideoAvecRetry(body, index, attempt + 1); }, 30000);
      return;
    }
    st.textContent = 'HTTP ' + res.status + '\n' + res.body.substring(0, 200);
    btn.disabled = false;
    btn.textContent = 'REESSAYER';
  })
  .catch(function(e) {
    st.textContent = 'Erreur reseau : ' + e.message + '\nRetry dans 10s...';
    setTimeout(function() { envoyerVideoAvecRetry(body, index, attempt + 1); }, 10000);
  });
}

function pollVideo(videoId, index, attempt) {
  var st = document.getElementById('vstat-' + index);
  var btn = document.getElementById('btnvideo-' + index);

  if (attempt === 0) {
    st.textContent = 'Preparation initiale (60s)...';
    var init = 60;
    var interval = setInterval(function() {
      init--;
      if (init <= 0) { clearInterval(interval); pollVideo(videoId, index, 1); }
      else { st.textContent = 'Preparation - ' + init + 's'; }
    }, 1000);
    return;
  }

  if (attempt > 100) {
    st.textContent = 'Delai maximal depasse';
    btn.disabled = false;
    btn.textContent = 'REESSAYER';
    return;
  }

  var url = 'https://apihub.agnes-ai.com/agnesapi?video_id=' + encodeURIComponent(videoId) + '&model_name=agnes-video-v2.0';

  fetch(url, { method: 'GET', headers: { 'Authorization': 'Bearer ' + API_KEY } })
  .then(function(r) { return r.text().then(function(txt) { return { status: r.status, body: txt }; }); })
  .then(function(res) {
    if (res.status !== 200) {
      st.textContent = 'Polling ' + attempt + ' - HTTP ' + res.status;
      setTimeout(function() { pollVideo(videoId, index, attempt + 1); }, 8000);
      return;
    }
    var d;
    try { d = JSON.parse(res.body); }
    catch(e) {
      st.textContent = 'Polling ' + attempt;
      setTimeout(function() { pollVideo(videoId, index, attempt + 1); }, 8000);
      return;
    }
    var status = d.status || 'unknown';
    var progress = d.progress || 0;
    st.textContent = status + ' - ' + progress + '% - essai ' + attempt;

    if (status === 'completed' || status === 'succeeded' || status === 'done') {
      var videoUrl = (d.metadata && d.metadata.url) || d.url || (d.output && d.output.url);
      if (!videoUrl) {
        st.textContent = 'Termine mais pas d URL';
        btn.disabled = false;
        btn.textContent = 'REESSAYER';
        return;
      }
      st.innerHTML = 'VIDEO PRETE !';
      var wrap = document.getElementById('vwrap-' + index);
      if (wrap && !wrap.querySelector('video')) {
        var video = document.createElement('video');
        video.src = videoUrl;
        video.controls = true;
        video.setAttribute('playsinline', '');
        video.style.cssText = 'width:100%;border-radius:8px;margin-top:.5rem;background:#000';
        wrap.appendChild(video);
      }
      var a = document.createElement('a');
      a.href = videoUrl;
      a.download = 'style-video-' + index + '.mp4';
      a.textContent = 'Telecharger';
      a.style.cssText = 'display:inline-block;margin-top:.5rem;padding:.5rem 1rem;background:#111;color:#fff;text-decoration:none;border-radius:6px;font-size:.8rem';
      var vwrap = document.getElementById('vwrap-' + index);
      if (vwrap && !vwrap.querySelector('a')) vwrap.appendChild(a);
      btn.disabled = false;
      btn.textContent = 'REGENERER';
      return;
    }

    if (status === 'failed' || status === 'error' || status === 'cancelled') {
      st.textContent = 'Echec : ' + status;
      btn.disabled = false;
      btn.textContent = 'REESSAYER';
      return;
    }

    setTimeout(function() { pollVideo(videoId, index, attempt + 1); }, 8000);
  })
  .catch(function(e) {
    st.textContent = 'Polling ' + attempt + ' - erreur';
    setTimeout(function() { pollVideo(videoId, index, attempt + 1); }, 10000);
  });
}
</script>
</body>
  </html>
